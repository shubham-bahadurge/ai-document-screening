<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Screening</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>🛡️ AI Document Screening System</h1>

        <p>
            Upload a document for automated screening
            and risk analysis.
        </p>

        <div class="card">

            <h2>Document Screening</h2>

            <input
                type="file"
                id="document"
                accept="image/*"
            >

            <button onclick="screenDocument()">
                🔍 Screen Document
            </button>

        </div>

        <div id="result"></div>

    </div>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
